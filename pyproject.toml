[project]
name = "hebbian"
version = "0.1.0"
description = "Hebbian-link clipboard: associative memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kuzu>=0.7.1",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0.1",
    "sentence-transformers>=2.2.2",
]

[project.scripts]
hebb = "hebbian.main:main"
explorer = "hebbian.explorer:explore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
